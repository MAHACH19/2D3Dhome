name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Calepinage.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Calepinage-apk
          path: Calepinage.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Calepinage 1.${{ github.run_number }}
          body: |
            Télécharger **Calepinage.apk** sur le téléphone, l'ouvrir et autoriser l'installation.
            Vos projets restent enregistrés dans l'appli d'une version à l'autre.
          files: Calepinage.apk
          make_latest: true
